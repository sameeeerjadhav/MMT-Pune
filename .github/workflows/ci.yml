name: CI

# Runs on every pull request and on every push to main, so a broken change is caught
# before it is merged (and again right after, in case two PRs interact).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse_inventory
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_NAME: warehouse_inventory
      DB_USER: warehouse
      DB_PASSWORD: warehouse_pass
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: App starts with production settings
        # DEBUG off makes settings.py enforce the secret key and allowed hosts, so a config that
        # would crash the server on deploy fails here first.
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: mmt.labxco.cloud
          DJANGO_CSRF_TRUSTED_ORIGINS: https://mmt.labxco.cloud
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy
      - name: Run tests
        run: python manage.py test --noinput

  mobile:
    name: Mobile (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
