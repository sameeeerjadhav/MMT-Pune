# Production stack for Dokploy / VPS
# Domain example: mmt.labxco.cloud → API at https://mmt.labxco.cloud/api/

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-warehouse_inventory}
      POSTGRES_USER: ${DB_USER:-warehouse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - warehouse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dokploy-network

  # Scheduled pg_dump of the database into the warehouse_backups volume (default: every night
  # 01:30 IST), keeping 7 daily + 4 weekly + 6 monthly copies. This protects against a bad
  # migration, a wiped volume or human error. It does NOT protect against losing the whole
  # server - also copy these dumps off the machine (see docs/backups.md).
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-warehouse_inventory}
      POSTGRES_USER: ${DB_USER:-warehouse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # Six-field cron (seconds first), server time = UTC. 20:00 UTC = 01:30 IST.
      SCHEDULE: ${BACKUP_SCHEDULE:-0 30 20 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - warehouse_backups:/backups
    networks:
      - dokploy-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-mmt.labxco.cloud}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://mmt.labxco.cloud}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      # Proxies in front of the API: 1 = Traefik only; 2 = Cloudflare (or similar) + Traefik.
      DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
      DB_NAME: ${DB_NAME:-warehouse_inventory}
      DB_USER: ${DB_USER:-warehouse}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      COMPANY_NAME: ${COMPANY_NAME:-Airport Equipment Manufacturing}
    volumes:
      - warehouse_media:/app/media
      - warehouse_static:/app/staticfiles
    # Reachable on dokploy-network only (Traefik). Do not publish 8000 on the host.
    expose:
      - "8000"
    networks:
      - dokploy-network

volumes:
  warehouse_pg_data:
  warehouse_backups:
  warehouse_media:
  warehouse_static:

networks:
  dokploy-network:
    external: true
