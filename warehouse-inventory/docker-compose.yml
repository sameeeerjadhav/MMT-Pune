services:
  db:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: warehouse_inventory
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse_pass
    volumes:
      - warehouse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_inventory"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  warehouse_pg_data:
